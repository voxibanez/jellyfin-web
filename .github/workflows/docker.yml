name: Build Docker image

on:
  workflow_call:
    inputs:
      tag:
        description: Container tag to publish
        required: true
        type: string
      extra_tag:
        description: Additional container tag
        required: false
        type: string
        default: ''
      platforms:
        description: Target architecture
        required: true
        type: string
      publish:
        description: Publish the multi-platform image to GHCR
        required: true
        type: boolean
      ref:
        description: Commit to build
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: Container tag to publish
        required: true
        default: latest
        type: string
      extra_tag:
        description: Additional container tag
        required: false
        default: ''
        type: string
      platforms:
        description: Target architecture
        required: true
        default: linux/amd64,linux/arm64
        type: choice
        options:
          - linux/amd64,linux/arm64
          - linux/amd64
          - linux/arm64
      publish:
        description: Publish the multi-platform image to GHCR
        required: true
        default: true
        type: boolean
      ref:
        description: Commit, branch, or tag to build. Empty uses the workflow commit.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  artifacts:
    name: Build ${{ matrix.arch }} artifact
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64

    steps:
      - name: Checkout repository
        if: ${{ contains(inputs.platforms, matrix.arch) }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up QEMU
        if: ${{ contains(inputs.platforms, matrix.arch) }}
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        if: ${{ contains(inputs.platforms, matrix.arch) }}
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build Docker image archive
        if: ${{ contains(inputs.platforms, matrix.arch) }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION=${{ inputs.ref || github.sha }}
          outputs: type=docker,dest=/tmp/jellyfin-web-${{ matrix.arch }}.tar
          tags: jellyfin-web:${{ inputs.tag }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Upload Docker image archive
        if: ${{ contains(inputs.platforms, matrix.arch) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jellyfin-web-docker-${{ matrix.arch }}
          path: /tmp/jellyfin-web-${{ matrix.arch }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish multi-platform image
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Normalize image name
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=sha,prefix=sha-
            ${{ inputs.extra_tag && format('type=raw,value={0}', inputs.extra_tag) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.ref || github.sha }}

      - name: Build and publish image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platforms }}
          build-args: |
            BUILD_VERSION=${{ inputs.ref || github.sha }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=multi-platform
          provenance: mode=max
          sbom: true
